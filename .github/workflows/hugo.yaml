# https://docs.github.com/en/actions/pages
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
    # 這些檔案不會進入網站輸出，改動時不需要重新部署
    paths-ignore:
      - ".gitignore"
      - "MCP.md"
      - "archetypes/**"
      - "cloud-mcp/**"
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.165.0"
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ startsWith(github.head_ref, 'mcp/reviews/') && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test SEO validator
        run: python3 -m unittest discover -s scripts -p 'test_check_seo.py' -v
      - name: Validate the single-article snapshot for MCP review PRs
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'mcp/reviews/')
        env:
          GITHUB_REF_NAME: ${{ github.head_ref }}
        run: python3 scripts/check_mcp_candidate.py
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url || 'https://coder.tw' }}/"
      - name: Validate published article SEO
        run: python3 scripts/check_seo.py --public-dir public --base-url "${{ steps.pages.outputs.base_url || 'https://coder.tw' }}/"
      - name: Export MCP article index
        run: python3 scripts/export_mcp_index.py --commit "$GITHUB_SHA" --output public/mcp-index.json
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    if: github.event_name != 'pull_request'
    needs: deploy
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove only unchanged branches from the deployed article PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cleanup_mcp_branches.py --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
