name: Test blog MCP

on:
  push:
    branches: ["main"]
    paths: ["cloud-mcp/**", "scripts/**", ".github/workflows/mcp-*.yaml"]
  pull_request:
    paths: ["cloud-mcp/**", "scripts/**", ".github/workflows/mcp-*.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud-mcp/package-lock.json
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm ci
        working-directory: cloud-mcp
      - run: npm run check && npm test && npm run build && npm run smoke
        working-directory: cloud-mcp
