name: Validate MCP publication

on:
  push:
    branches: ["mcp/candidates/**", "mcp/reviews/**"]

permissions:
  contents: read

concurrency:
  group: mcp-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUGO_VERSION: "0.165.0"
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify candidate contains only its selected article and images
        run: python3 scripts/check_mcp_candidate.py
      - name: Install Hugo
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Build candidate
        run: hugo --gc --minify --baseURL "https://coder.tw/"
      - name: Validate article SEO
        run: python3 scripts/check_seo.py --public-dir public --base-url "https://coder.tw/"
