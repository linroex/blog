baseURL = "https://coder.tw/"
title = "Lin's Blog"
theme = "PaperMod"
defaultContentLanguage = "zh-tw"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[pagination]
pagerSize = 10

[params]
  disableThemeToggle = true

  disableSpecial1stPost = true
  imageBase = "https://pub-6c026d2742d14927bfa2d850c31eac91.r2.dev"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.profileMode]
  enabled = false

[params.homeInfoMode]
  Disabled = true

[taxonomies]
  category = "categories"
  tag = "tags"

[languages]
  [languages.zh-tw]
    languageName = "繁中"
    locale = "zh-TW"
    weight = 1
    [languages.zh-tw.params]
      description = "我的技術部落格"
    [[languages.zh-tw.menu.main]]
      identifier = "posts"
      name = "文章"
      url = "/posts/"
      weight = 1
    [[languages.zh-tw.menu.main]]
      identifier = "categories"
      name = "分類"
      url = "/categories/"
      weight = 2
    [[languages.zh-tw.menu.main]]
      identifier = "about"
      name = "關於"
      url = "/about/"
      weight = 3

  [languages.en]
    languageName = "English"
    locale = "en-US"
    weight = 2
    [languages.en.params]
      description = "Lin's tech blog"
    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 1
    [[languages.en.menu.main]]
      identifier = "categories"
      name = "Categories"
      url = "/categories/"
      weight = 2
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 3

  [languages.ja]
    languageName = "日本語"
    locale = "ja-JP"
    weight = 3
    [languages.ja.params]
      description = "Lin の技術ブログ"
    [[languages.ja.menu.main]]
      identifier = "posts"
      name = "記事"
      url = "/posts/"
      weight = 1
    [[languages.ja.menu.main]]
      identifier = "categories"
      name = "カテゴリー"
      url = "/categories/"
      weight = 2
    [[languages.ja.menu.main]]
      identifier = "about"
      name = "プロフィール"
      url = "/about/"
      weight = 3

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "github-dark"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
